<svg
  width="280"
  height="52"
  viewBox="0 0 280 52"
  xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Main Blue → Cyan -->
    <linearGradient
      id="brandGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%">

      <stop offset="0%" stop-color="#1B63F2"/>
      <stop offset="55%" stop-color="#20A4F3"/>
      <stop offset="100%" stop-color="#18E3C8"/>

    </linearGradient>

  </defs>


  <!-- ========================= -->
  <!-- LEFT CODE LOGO -->
  <!-- ========================= -->

  <!-- < -->
  <polyline
    points="8,15 1,26 8,37"
    fill="none"
    stroke="url(#brandGradient)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- N -->
  <text
    x="15"
    y="36"
    font-family="'Courier New', monospace"
    font-size="29"
    font-weight="900"
    fill="#FFFFFF">
    N
  </text>

  <!-- K -->
  <text
    x="37"
    y="36"
    font-family="'Courier New', monospace"
    font-size="29"
    font-weight="900"
    fill="url(#brandGradient)">
    K
  </text>

  <!-- / -->
  <line
    x1="61"
    y1="37"
    x2="67"
    y2="15"
    stroke="url(#brandGradient)"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- > -->
  <polyline
    points="66,15 73,26 66,37"
    fill="none"
    stroke="url(#brandGradient)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />


  <!-- ========================= -->
  <!-- SEPARATOR -->
  <!-- ========================= -->

  <line
    x1="84"
    y1="12"
    x2="84"
    y2="40"
    stroke="#FFFFFF"
    stroke-width="1"
    opacity="0.25"
  />


  <!-- ========================= -->
  <!-- PROFESSIONAL TITLE -->
  <!-- ========================= -->

  <text
    x="96"
    y="22"
    font-family="Arial, sans-serif"
    font-size="8.5"
    font-weight="700"
    letter-spacing="0.8"
    fill="#FFFFFF">

    SOFTWARE ENGINEER

  </text>


  <text
    x="96"
    y="34"
    font-family="Arial, sans-serif"
    font-size="8"
    font-weight="600"
    letter-spacing="0.7"
    fill="#18E3C8">

    .NET DEVELOPER • ANGULAR • DEVOPS

  </text>


  <!-- ========================= -->
  <!-- SMALL CODE LINE -->
  <!-- ========================= -->

  <line
    x1="96"
    y1="41"
    x2="174"
    y2="41"
    stroke="url(#brandGradient)"
    stroke-width="1.5"
    stroke-linecap="round"
  />

</svg>
